services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    networks:
      - book_store
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    networks:
      - book_store
    env_file:
      - ./frontend/.env

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    networks:
      - book_store
    volumes:
      - mongo-data:/data/db

networks:
  book_store:
    driver: bridge

volumes:
  mongo-data:
    driver: local